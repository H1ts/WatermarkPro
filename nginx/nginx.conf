proxy_cache_path /tmp/hls_auth_cache levels=1:2 keys_zone=hls_auth:1m max_size=10m inactive=5m;

server {
    listen 80;
    server_name _;
    client_max_body_size 10G;

    # Frontend (SPA — all non-API/non-HLS routes)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    # Frontend: project pages (SPA routing)
    location /projects/ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    # Frontend: review pages (SPA routing)
    location /review/ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    # Frontend: share pages (SPA routing)
    location /share/ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    # Frontend: compare pages (SPA routing)
    location /compare/ {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    # API
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Watch page (served by API)
    location /watch/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # HLS auth subrequest (с кешем — одна проверка на 2 мин)
    location = /auth/hls {
        internal;
        proxy_pass http://api:8000/auth/hls;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;

        proxy_cache hls_auth;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 2m;
        proxy_cache_valid 403 5s;
    }

    # HLS segments (protected by signed token)
    location /hls/ {
        auth_request /auth/hls;
        alias /data/hls/;
        add_header Access-Control-Allow-Origin *;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        # m3u8 не кешировать, ts сегменты кешировать
        location ~* \.m3u8$ {
            auth_request /auth/hls;
            alias /data/hls/;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "no-cache";
            types {
                application/vnd.apple.mpegurl m3u8;
            }
        }
        location ~* \.ts$ {
            auth_request /auth/hls;
            alias /data/hls/;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "max-age=3600";
            types {
                video/mp2t ts;
            }
        }
    }
}
